name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/capitalos-api/package-lock.json
            functions/capitalos-month-end/package-lock.json
            functions/capitalos-daily-summary/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm ci --prefix functions/capitalos-api
      - run: npm ci --prefix functions/capitalos-month-end
      - run: npm ci --prefix functions/capitalos-daily-summary
      - run: npm run validate
